<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugün Ne Yemek Yapsam?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            maroon: '#800000',
            ivory: '#fffff0',
            darkbg: '#000000',
            darkcard: '#121212',
            darkborder: '#222222'
          }
        }
      }
    }
  </script>
  <style>
    /* Temel geçiş efektleri */
    html {
      background-color: #fffff0;
    }

    html.dark {
      background-color: #000000;
    }

    body {
      transition: background-color 0.4s ease, color 0.4s ease;
      margin: 0;
      min-height: 100vh;
    }
  </style>
</head>

<body class="bg-ivory dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
